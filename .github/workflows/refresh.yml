name: refresh index

on:
  schedule:
    # Upstream publishes around 04:30 UTC; rebuild shortly after.
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build index.json
        run: npm run build

      - name: Commit when it changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "index.json is already current"
          else
            git commit -m "chore: refresh index $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge and verify the jsDelivr copy
        if: steps.commit.outputs.changed == 'true'
        run: |
          # The market reads this file from jsDelivr; a stale edge cache is the failure
          # mode users would actually see, so fail the run when the CDN keeps serving
          # the previous bytes after a purge.
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/index.json" > purge.json || true
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/index.json" -o cdn.json \
              && cmp -s cdn.json index.json; then
              echo "CDN serves the freshly committed index"
              exit 0
            fi
            echo "attempt ${attempt}: CDN still stale, retrying in 15s"
            sleep 15
          done
          echo "CDN still serves stale bytes after purge" >&2
          exit 1
